<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WAYVORA — Phase 6.1 Deterministic Audio Export Test</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      max-width: 680px;
      margin: 0 auto;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #7dd3fc;
    }
    #status-msg {
      margin-top: 15px;
      padding: 12px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid #334155;
      font-family: monospace;
      font-size: 13px;
    }
    video {
      margin-top: 15px;
      width: 100%;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>WAYVORA Phase 6.1 Audio Export Test</h2>
    <p>Exercises the full hardware WebCodecs VideoEncoder + AudioEncoder + mp4-muxer pipeline with multi-track audio, automatic music ducking, and saves the MP4 artifact to disk.</p>
    <button id="run-btn">Start Deterministic Audio Export</button>
    <div id="status-msg">Click button or execute window.runDeterministicAudioExport() to begin.</div>
    <video id="preview-player" controls></video>
  </div>
  <script type="module" src="/src/test/runAudioExportTest.ts"></script>
</body>
</html>
