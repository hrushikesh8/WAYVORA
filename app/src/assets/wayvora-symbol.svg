<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Ambient Sun Glow -->
    <radialGradient id="wv-s-halo" cx="256" cy="180" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.16" />
      <stop offset="85%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Sunset Sun Disk -->
    <linearGradient id="wv-s-sun" x1="256" y1="96" x2="256" y2="264" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Distant Mountains Layer -->
    <linearGradient id="wv-s-mtn-back" x1="256" y1="150" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f18" />
    </linearGradient>

    <!-- Left Mountain Slope -->
    <linearGradient id="wv-s-mtn-l" x1="120" y1="180" x2="220" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#182338" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Right Mountain Slope -->
    <linearGradient id="wv-s-mtn-r" x1="390" y1="180" x2="290" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b263c" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <!-- Mountain Rim Sunlight Accent -->
    <linearGradient id="wv-s-mtn-rim" x1="256" y1="160" x2="256" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </linearGradient>

    <!-- Left Wing - Luminous Cyan/Teal Sweep -->
    <linearGradient id="wv-s-teal" x1="45" y1="210" x2="210" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="20%" stop-color="#0ea5e9" />
      <stop offset="55%" stop-color="#06b6d4" />
      <stop offset="85%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Left Wing - Inner Amber Ribbon Twist -->
    <linearGradient id="wv-s-amber" x1="170" y1="370" x2="265" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Highway Road Surface Gradient -->
    <linearGradient id="wv-s-road" x1="256" y1="215" x2="360" y2="405" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Road Left Golden Curb -->
    <linearGradient id="wv-s-curb" x1="220" y1="230" x2="340" y2="405" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Right Wing - Sunset Amber / Golden Flare -->
    <linearGradient id="wv-s-orange" x1="300" y1="270" x2="480" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Right Wing Depth Shading -->
    <linearGradient id="wv-s-shadow" x1="340" y1="380" x2="410" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="50%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <!-- Atmospheric Sun Aura -->
  <circle cx="256" cy="180" r="145" fill="url(#wv-s-halo)" />

  <!-- Golden Sunset Sun Disk -->
  <circle cx="256" cy="180" r="82" fill="url(#wv-s-sun)" />

  <!-- Natural Layered Mountain Silhouette Behind Road -->
  <path d="M 20 280 L 125 160 L 210 220 L 256 205 L 302 220 L 387 160 L 492 280 L 492 340 L 20 340 Z" fill="url(#wv-s-mtn-back)" />
  <path d="M 125 160 L 210 220 L 256 205 L 302 220 L 387 160" stroke="url(#wv-s-mtn-rim)" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Left Foreground Mountain Slope -->
  <path d="M 20 310 L 95 195 L 185 245 L 248 226 L 248 350 L 20 350 Z" fill="url(#wv-s-mtn-l)" />
  <!-- Right Foreground Mountain Slope -->
  <path d="M 492 310 L 417 195 L 327 245 L 264 226 L 264 350 L 492 350 Z" fill="url(#wv-s-mtn-r)" />

  <!-- Sunset Reflection in Mountain Pass -->
  <polygon points="230,224 282,224 274,248 238,248" fill="#f59e0b" opacity="0.6" />
  <polygon points="244,244 268,244 262,258 250,258" fill="#fde047" opacity="0.75" />

  <!-- Left Wing Outer Face (Broad, Sculpted, Voluptuous Cyan/Teal Ribbon) -->
  <path d="M 45 214 C 76 190, 114 218, 134 266 C 154 316, 172 388, 214 406 C 234 414, 252 400, 260 372 C 246 386, 226 390, 206 376 C 168 350, 146 280, 126 238 C 108 198, 76 190, 45 214 Z"
        fill="url(#wv-s-teal)" />

  <!-- Left Wing Inner Face (Twisting into Golden Amber Road Crest) -->
  <path d="M 206 376 C 226 390, 246 386, 260 372 C 270 342, 258 290, 274 262 C 286 242, 304 235, 320 244 C 302 232, 278 240, 262 262 C 238 292, 226 348, 206 376 Z"
        fill="url(#wv-s-amber)" />

  <!-- Winding Asphalt Highway (Originates at Sunset Horizon, Sweeps to Foreground) -->
  <path d="M 250 216 C 240 230, 238 248, 246 264 C 258 288, 280 308, 306 335 C 330 362, 348 388, 368 405 C 386 388, 384 354, 368 322 C 352 290, 326 266, 308 246 C 295 232, 284 224, 266 216 Z"
        fill="url(#wv-s-road)" />

  <!-- Road Golden Left Shoulder / Curb Ribbon -->
  <path d="M 248 217 C 236 232, 234 250, 242 268 C 254 292, 276 312, 302 340 C 326 368, 344 395, 363 408 C 357 408, 341 384, 322 356 C 298 322, 276 296, 258 272 C 246 252, 252 232, 264 218 Z"
        fill="url(#wv-s-curb)" />

  <!-- 5 Clean, Bold Centerline Dashes (High-Contrast, Visible at 32px) -->
  <path d="M 255 220 L 252 226" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 249 236 L 253 246" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95" />
  <path d="M 263 260 L 273 276" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <path d="M 287 294 L 305 318" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" />
  <path d="M 324 338 L 348 372" stroke="#ffffff" stroke-width="11.5" stroke-linecap="round" />

  <!-- Right Wing (Lush Sunset Orange & Golden Flare) -->
  <path d="M 368 405 C 382 418, 404 416, 420 392 C 442 358, 460 304, 490 224 C 466 208, 442 226, 428 258 C 404 312, 388 358, 374 378 C 369 384, 365 398, 368 405 Z"
        fill="url(#wv-s-orange)" />

  <!-- Right Wing Inner Shading & Depth -->
  <path d="M 368 322 C 384 354, 386 388, 368 405 C 376 410, 392 410, 403 388 C 414 366, 420 340, 426 314 C 406 330, 386 330, 368 322 Z"
        fill="url(#wv-s-shadow)" opacity="0.8" />
</svg>
