<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 72" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="wv-hl-bg" x1="36" y1="4" x2="36" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="65%" stop-color="#05070c" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>

    <!-- Sun Disk -->
    <linearGradient id="wv-hl-sun" x1="36" y1="14" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Mountains -->
    <linearGradient id="wv-hl-mtn" x1="36" y1="20" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Left Wing Teal -->
    <linearGradient id="wv-hl-teal" x1="8" y1="30" x2="30" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Left Wing Amber Fold -->
    <linearGradient id="wv-hl-amber" x1="24" y1="52" x2="37" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Center Road -->
    <linearGradient id="wv-hl-road" x1="36" y1="30" x2="50" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Right Wing Orange -->
    <linearGradient id="wv-hl-orange" x1="42" y1="38" x2="68" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Typography Gradient -->
    <linearGradient id="wv-hl-text" x1="84" y1="18" x2="280" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Group (scaled 64x64 at x=4, y=4) -->
  <g transform="translate(4, 4) scale(0.125)">
    <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#wv-hl-bg)" stroke="rgba(255,255,255,0.85)" stroke-width="6" />
    <circle cx="256" cy="180" r="145" fill="#f59e0b" opacity="0.3" />
    <circle cx="256" cy="180" r="82" fill="url(#wv-hl-sun)" />
    <path d="M 20 280 L 125 160 L 210 220 L 256 205 L 302 220 L 387 160 L 492 280 L 492 340 L 20 340 Z" fill="url(#wv-hl-mtn)" />
    <polygon points="230,224 282,224 274,248 238,248" fill="#f59e0b" opacity="0.6" />
    <path d="M 45 214 C 76 190, 114 218, 134 266 C 154 316, 172 388, 214 406 C 234 414, 252 400, 260 372 C 246 386, 226 390, 206 376 C 168 350, 146 280, 126 238 C 108 198, 76 190, 45 214 Z" fill="url(#wv-hl-teal)" />
    <path d="M 206 376 C 226 390, 246 386, 260 372 C 270 342, 258 290, 274 262 C 286 242, 304 235, 320 244 C 302 232, 278 240, 262 262 C 238 292, 226 348, 206 376 Z" fill="url(#wv-hl-amber)" />
    <path d="M 250 216 C 240 230, 238 248, 246 264 C 258 288, 280 308, 306 335 C 330 362, 348 388, 368 405 C 386 388, 384 354, 368 322 C 352 290, 326 266, 308 246 C 295 232, 284 224, 266 216 Z" fill="url(#wv-hl-road)" />
    <path d="M 249 236 L 253 246" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <path d="M 263 260 L 273 276" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
    <path d="M 287 294 L 305 318" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <path d="M 324 338 L 348 372" stroke="#ffffff" stroke-width="15" stroke-linecap="round" />
    <path d="M 368 405 C 382 418, 404 416, 420 392 C 442 358, 460 304, 490 224 C 466 208, 442 226, 428 258 C 404 312, 388 358, 374 378 C 369 384, 365 398, 368 405 Z" fill="url(#wv-hl-orange)" />
  </g>

  <!-- Typography: WAYVORA -->
  <text x="84" y="41"
        font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="32"
        font-weight="800"
        letter-spacing="3.8"
        fill="url(#wv-hl-text)">WAYVORA</text>

  <!-- Tagline: FROM ROADS TO TRAILS -->
  <text x="85" y="58"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="10"
        font-weight="600"
        letter-spacing="2.4"
        fill="#f59e0b"
        opacity="0.95">FROM ROADS TO TRAILS</text>
</svg>
